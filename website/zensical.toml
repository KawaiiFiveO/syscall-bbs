[project]
site_name = "SysCall BBS"
site_description = "Modloader for Last Call BBS"
docs_dir = "stage"
site_dir = "site"
use_directory_urls = false
repo_url = "https://github.com/KawaiiFiveO/syscall-bbs"
repo_name = "syscall-bbs"
copyright = "SysCall BBS is an unofficial fan project. Not affiliated with Zachtronics."

nav = [
  { "Main menu" = "README.md" },
  { "Mods" = [
    { "Yomiel" = "mods/YomielPlayer/README.md" },
    { "Muzakal" = "mods/TrackerPlayer/README.md" },
    { "FoodCourtTools" = "mods/FoodCourtTools/README.md" },
  ] },
  { "Files" = [
    { "Making mods" = "docs/making-mods.md" },
    { "Textures" = "docs/textures.md" },
    { "Food Court solution format" = "docs/food-court-format.md" },
    { "Food Court netlist language" = "docs/food-court-netlist.md" },
    { "Save file" = "docs/save-file.md" },
  ] },
]

extra_css = ["_theme/fonts.css", "_theme/syscall.css"]

[project.theme]
language = "en"
# Fonts are bundled: theme/fonts.css, from fetch_fonts.py.
font = false
favicon = "_theme/favicon.png"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/cpu"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "syscall"
primary = "custom"
accent = "custom"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = "#"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.details = {}

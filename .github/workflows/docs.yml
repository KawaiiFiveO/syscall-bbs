# Builds the documentation site (website/build.py publish) and deploys it to GitHub Pages
# when the docs change on main. Pull requests only build it. Run by hand from Actions > Docs.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - mods/*/README.md
      - website/**
      - launcher/package.ps1
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - mods/*/README.md
      - website/**
      - launcher/package.ps1
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install Zensical
        run: pip install -r website/requirements.txt

      - name: Build
        run: python website/build.py publish

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

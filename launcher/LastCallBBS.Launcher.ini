# SysCall BBS mod launcher settings.
# Values are true/false. Lines starting with # are comments.
# Each mod's own settings are in mods\<Name>\config.ini.

# Open a console window that shows the log while the game runs.
Console = true

# Steam build only. Leaderboards are always blocked when the game is started
# through this launcher. Starting the game normally is unaffected.
# These two features can also be turned off:
Achievements = true
RichPresence = true

# Steam build only. Show your own scores in the Food Court results list
# instead of leaving it blank.
LocalScoreList = true

# Steam build only. Use another folder in Documents\My Games\Last Call BBS for
# modded runs, leaving your Steam save untouched. Set to NonSteamUser to use your
# GOG saves. Leave blank to use your normal Steam save.
SaveFolder =

# A mod limited to part of the game is blocked if its code reaches outside that
# part. If you trust such a mod, allow it with a line using the mod's id:
# AllowUnscoped.author.modname = true

# Optional: folder containing "Last Call BBS.exe". Leave blank when this
# launcher sits in the game folder.
GameDirectory =

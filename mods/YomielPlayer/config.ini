# Window size in characters. At most 106 x 33.
Columns = 96
Rows = 30

# Folder with story files (.z5, .z8). A relative path is inside this mod's folder.
StoryFolder = stories

# Lines kept for scrolling back with Page Up and Page Down.
Scrollback = 1000

# Pause with [MORE] when more than a screenful of text arrives at once.
MorePrompts = true

# Window size in characters. At most 106 x 33.
Columns = 80
Rows = 30

# Folder with modules (.mod). A relative path is inside this mod's folder.
ModuleFolder = modules

# Playback volume, 0 to 100, on top of the game's music volume.
Volume = 100

# Output level in percent: 100 brings four channels at full volume to full scale.
Amplification = 100

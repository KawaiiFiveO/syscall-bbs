# Skip Loading settings. Values are true/false.

# Finish BBS downloads the moment they start, instead of waiting minutes.
InstantDownloads = true

# After each download the BBS enforces a 15-minute real-time quota before the
# next one. Set to true to remove it.
NoDownloadCooldown = true

# After every program is downloaded, the game makes you wait 12 real-world
# hours before something new happens when you next connect.
# Set to true to treat those 12 hours as already elapsed.
SkipTwelveHourWait = false
